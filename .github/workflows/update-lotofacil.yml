name: Atualizar resultado Lotofácil

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar e salvar resultado mais recente
        run: python3 .github/scripts/update_latest.py

      - name: Commit se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --staged --quiet || git commit -m "Atualiza resultado mais recente da Lotofácil"
          git push
